    // Helper functions
    const calculateAge = (dobString) => {
      if (!dobString) return 0;
      const today = new Date();
      const birthDate = new Date(dobString);
      let age = today.getFullYear() - birthDate.getFullYear();
      const m = today.getMonth() - birthDate.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
      }
      return age;
    };

    const evaluateBloodSugar = (val) => {
      if (!val) return null;
      if (val < 90) return { status: 'Rendah', level: 'low', ref: 'PERKENI: Hipoglikemia' };
      if (val <= 140) return { status: 'Normal', level: 'normal', ref: 'PERKENI: Normal (90-140 mg/dL)' };
      if (val <= 199) return { status: 'Pre-Diabetes', level: 'warning', ref: 'PERKENI: Toleransi Glukosa Terganggu' };
      return { status: 'Tinggi', level: 'high', ref: 'PERKENI: Indikasi Diabetes (≥200 mg/dL)' };
    };

    const evaluateBloodPressure = (systolic, diastolic) => {
      if (!systolic || !diastolic) return null;
      if (systolic < 90 || diastolic < 60) return { status: 'Rendah', level: 'low', ref: 'INA-SH: Hipotensi' };
      if (systolic <= 120 && diastolic <= 80) return { status: 'Normal', level: 'normal', ref: 'Kemenkes RI: Normal (≤120/80)' };
      if (systolic <= 139 || diastolic <= 89) return { status: 'Pre-Hipertensi', level: 'warning', ref: 'Kemenkes RI: 121-139 / 81-89' };
      return { status: 'Hipertensi', level: 'high', ref: 'JNC 8: Waspada Hipertensi (≥140/90)' };
    };

    const evaluateCholesterol = (val) => {
      if (!val) return null;
      if (val < 200) return { status: 'Normal', level: 'normal', ref: 'Target &lt;200 mg/dL' };
      if (val <= 239) return { status: 'Batas Tinggi', level: 'warning', ref: 'Ambang Batas 200-239 mg/dL' };
      return { status: 'Tinggi', level: 'high', ref: 'Risiko Dislipidemia (≥240 mg/dL)' };
    };

        warning: 'bg-amber-50 text-amber-800 border-amber-200',
        high: 'bg-rose-50 text-rose-700 border-rose-200',
      }[evaluation.level] || 'bg-slate-100 text-slate-700 border-slate-200';

      return (
        <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold border ${config}`}>

    // SVG Line Chart Component
    const SimpleLineChart = ({ data, metricKey, color = '#0d9488' }) => {
      if (!data || data.length < 2) {
        return (
          <div className="py-4 text-center text-xs text-slate-400 bg-slate-50 rounded-xl">
            Perlu minimal 2 data pemeriksaan untuk menampilkan grafik tren.
          </div>
        );
      }
      const sorted = [...data].sort((a, b) => new Date(a.date) - new Date(b.date));
      const points = sorted.map(d => ({
        val: d[metricKey],
        date: d.date.split('-').slice(1).join('/')
      })).filter(p => p.val !== undefined && p.val !== null);

      if (points.length < 2) return null;

      const values = points.map(p => p.val);
      const dataMin = Math.min(...values);
      const dataMax = Math.max(...values);
      const pad = (dataMax - dataMin) * 0.2 || 10;
      const effectiveMin = Math.max(0, Math.floor(dataMin - pad));
      const effectiveMax = Math.ceil(dataMax + pad);

      const width = 310;
      const height = 110;
      const padding = { top: 12, right: 12, bottom: 24, left: 24 };

      const getX = (index) => padding.left + (index / (points.length - 1)) * (width - padding.left - padding.right);
      const getY = (val) => {
        const range = effectiveMax - effectiveMin || 1;
        return height - padding.bottom - ((val - effectiveMin) / range) * (height - padding.top - padding.bottom);
      };

      const pathD = points.reduce((acc, point, i) => {
        const x = getX(i);
        const y = getY(point.val);
        return i === 0 ? `M ${x} ${y}` : `${acc} L ${x} ${y}`;
      }, '');

      const areaD = points.reduce((acc, point, i) => {
        const x = getX(i);
        const y = getY(point.val);
        return i === 0 ? `M ${x} ${y}` : `${acc} L ${x} ${y}`;
      }, '') + ` L ${getX(points.length - 1)} ${height - padding.bottom} L ${getX(0)} ${height - padding.bottom} Z`;

      return (
        <div className="w-full">

                <stop offset="100%" stopColor={color} stopOpacity="0.0" />
              </linearGradient>
            </defs>
            <line x1={padding.left} y1={getY(effectiveMin)} x2={width - padding.right} y2={getY(effectiveMin)} stroke="#f1f5f9" strokeWidth="1" />
            <path d={areaD} fill={`url(#grad-${metricKey})`} />
            <path d={pathD} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
            {points.map((p, i) => (
              <g key={i}>
                <circle cx={getX(i)} cy={getY(p.val)} r="3.5" fill="#ffffff" stroke={color} strokeWidth="2" />
                <text x={getX(i)} y={getY(p.val) - 6} textAnchor="middle" fontSize="9" fontWeight="700" fill="#334155">

                </text>
                <text x={getX(i)} y={height - 6} textAnchor="middle" fontSize="8" fill="#94a3b8" fontWeight="500">
                  {p.date}
                </text>
              </g>
            ))}
          </svg>
        </div>
      );
    };

    // Main App Component

      // Family Name State
      const [familyName, setFamilyName] = useState(() => localStorage.getItem('medfam_family_name') || 'Keluarga Pratama');

      // Supabase Cloud State
      const [supabaseUrl, setSupabaseUrl] = useState(() => localStorage.getItem('supabase_url') || '');
      const [supabaseKey, setSupabaseKey] = useState(() => localStorage.getItem('supabase_anon_key') || '');
      const [isSupabaseConnected, setIsSupabaseConnected] = useState(false);
      const [isSyncingCloud, setIsSyncingCloud] = useState(false);
      const [cloudStatusText, setCloudStatusText] = useState('Penyimpanan Lokal');
      const fileInputRef = useRef(null);
      const backupFileInputRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem('medfam_demo_data', JSON.stringify(members));
        } catch (e) {
          console.warn('Storage quota warning', e);
        }
      }, [members]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const selectedMember = useMemo(() => {
        return members.find(m => m.id === selectedMemberId);
      }, [members, selectedMemberId]);

      // Security PIN Methods
      const hashPin = async (pin, salt = 'family_health_salt_') => {
        const encoder = new TextEncoder();
        const data = encoder.encode(salt + pin);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      };

      const handlePinPress = async (num) => {
        if (Date.now() < lockoutUntil) {
          setPinError('Keypad terkunci sementara.');
          return;
        }
        if (pinBuffer.length >= 4) return;
        const newBuf = pinBuffer + num.toString();
        setPinBuffer(newBuf);

        if (newBuf.length === 4) {
          if (isPinSetup || isChangingPin) {
            if (pinStep === 1) {
              setTempNewPin(newBuf);
              setPinStep(2);
              setPinBuffer('');
              setPinError('');
            } else {
              if (newBuf === tempNewPin) {
                const hash = await hashPin(newBuf);
                localStorage.setItem('family_pin_hash', hash);
                setPinHash(hash);
                setIsLocked(false);
                setIsPinSetup(false);
                setIsChangingPin(false);
                setPinBuffer('');
                setPinStep(1);
                setPinError('');
                showToast('PIN MedFam berhasil disimpan!');
                if (window.supabaseClient) {
                  try {
                    await window.supabaseClient.from('app_settings').upsert({
                      key: 'family_pin_hash',
                      value: { hash },
                      updated_at: new Date().toISOString()
                    });
                  } catch(e) {}
                }
              } else {
                setPinError('PIN konfirmasi tidak cocok. Ulangi dari awal.');
                setPinBuffer('');
                setPinStep(1);
                setTempNewPin('');
              }
            }
          } else {
            const inputHash1 = await hashPin(newBuf, 'family_health_salt_');
            const inputHash2 = await hashPin(newBuf, 'medfam_health_salt_');
            if (inputHash1 === pinHash || inputHash2 === pinHash) {
              setIsLocked(false);
              setPinBuffer('');
              setPinError('');
              setFailedAttempts(0);
              localStorage.removeItem('pin_failed_attempts');
              localStorage.removeItem('pin_lockout_until');
              showToast('MedFam terbuka!');
            } else {
              const attempts = failedAttempts + 1;
              setFailedAttempts(attempts);
              localStorage.setItem('pin_failed_attempts', attempts.toString());
              setPinBuffer('');
              if (attempts >= 5) {
                const lockUntil = Date.now() + 30 * 1000;
                setLockoutUntil(lockUntil);
                localStorage.setItem('pin_lockout_until', lockUntil.toString());
                setPinError('Terlalu banyak percobaan salah! Terkunci 30 detik.');
              } else {
                setPinError('PIN salah! Sisa percobaan: ' + (5 - attempts) + 'x');
              }
            }
          }
        }
      };

      const initSupabase = async (rawUrl, rawKey) => {
        if (!rawUrl || !rawKey || !window.supabase) {
          setIsSupabaseConnected(false);
          setCloudStatusText('Penyimpanan Lokal');
          return false;
        }
        const url = rawUrl.trim().replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '');
        const key = rawKey.trim();
        try {
          const client = window.supabase.createClient(url, key);
          window.supabaseClient = client;
          const { error } = await client.from('app_settings').select('key').limit(1);
          if (!error) {
            setIsSupabaseConnected(true);
            setCloudStatusText('Terhubung ke Supabase Cloud');
            const { data: pinData } = await client.from('app_settings').select('value').eq('key', 'family_pin_hash').single();
            if (pinData && pinData.value && pinData.value.hash) {
              localStorage.setItem('family_pin_hash', pinData.value.hash);
              setPinHash(pinData.value.hash);
            }
            return true;
          } else {
            setIsSupabaseConnected(false);
            setCloudStatusText('Error: ' + error.message);
            return false;
          }
        } catch(e) {
          setIsSupabaseConnected(false);
          setCloudStatusText('Error: ' + e.message);
          return false;
        }
      };

      const handleSaveSupabase = async (rawUrl, rawKey) => {
        const url = rawUrl.trim().replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '');
        const key = rawKey.trim();
        localStorage.setItem('supabase_url', url);
        localStorage.setItem('supabase_anon_key', key);
        setSupabaseUrl(url);
        setSupabaseKey(key);
        setIsSyncingCloud(true);
        const ok = await initSupabase(url, key);
        setIsSyncingCloud(false);
        if (ok) {
          showToast('✅ Berhasil terhubung ke Supabase Cloud!');
        } else {
          showToast('⚠️ Gagal menghubungkan Supabase.');
        }
      };

      const handleSyncToCloud = async () => {
        if (!window.supabaseClient) {
          alert('Hubungkan ke Supabase terlebih dahulu');
          return;
        }
        setIsSyncingCloud(true);
        try {
          await window.supabaseClient.from('app_settings').upsert({
            key: 'medfam_family_data',
            value: { members, familyName },
            updated_at: new Date().toISOString()
          });
          if (pinHash) {
            await window.supabaseClient.from('app_settings').upsert({
              key: 'family_pin_hash',
              value: { hash: pinHash },
              updated_at: new Date().toISOString()
            });
          }
          showToast('✅ Seluruh data MedFam tersinkron ke Cloud!');
        } catch(e) {
          alert('Gagal sinkronisasi: ' + e.message);
        } finally {
          setIsSyncingCloud(false);
        }
      };

      const handlePullFromCloud = async () => {
        if (!window.supabaseClient) return;
        setIsSyncingCloud(true);
        try {
          const { data, error } = await window.supabaseClient.from('app_settings').select('value').eq('key', 'medfam_family_data').single();
          if (data && data.value && Array.isArray(data.value.members)) {
            setMembers(data.value.members);
            if (data.value.familyName) {
              setFamilyName(data.value.familyName);
              localStorage.setItem('medfam_family_name', data.value.familyName);
            }
            showToast('✅ Data diperbarui dari Cloud!');
          }
        } catch(e) {
          console.warn(e);
        } finally {
          setIsSyncingCloud(false);
        }
      };

      useEffect(() => {
        const savedUrl = localStorage.getItem('supabase_url');
        const savedKey = localStorage.getItem('supabase_anon_key');
        if (savedUrl && savedKey) {
          initSupabase(savedUrl, savedKey).then(ok => {
            if (ok) handlePullFromCloud();
          });
        }
      }, []);

      // Add Member
      const handleCreateMember = (e) => {
        e.preventDefault();
        const form = e.target;
        const name = form.name.value.trim();
        const dob = form.dob.value;
        const gender = form.gender.value;
        const relation = form.relation.value;
        const bloodType = form.bloodType.value || 'O+';

        if (!name || !dob) return;

        const colors = [
          'from-teal-500 to-emerald-600',
          'from-sky-500 to-blue-600',
          'from-indigo-500 to-purple-600',
          'from-rose-400 to-red-600'
        ];
        const randomColor = colors[Math.floor(Math.random() * colors.length)];

        const newMember = {
          id: 'fam-' + Date.now(),
          name,
          dob,
          gender,
          relation,
          bloodType,
          avatarColor: randomColor,
          checkups: [],
          illnesses: [],
          documents: []
        };

        setMembers([newMember, ...members]);
        setShowAddMemberModal(false);
        showToast(`Profil ${name} berhasil ditambahkan!`);
      };

      // Add Checkup
      const handleCreateCheckup = (e) => {
        e.preventDefault();
        const form = e.target;
        const newCheckup = {
          id: 'chk-' + Date.now(),
          date: form.checkupDate.value || new Date().toISOString().split('T')[0],
          bloodSugar: form.bloodSugar.value ? Number(form.bloodSugar.value) : null,
          bpSystolic: form.bpSystolic.value ? Number(form.bpSystolic.value) : null,
          bpDiastolic: form.bpDiastolic.value ? Number(form.bpDiastolic.value) : null,
          cholesterol: form.cholesterol.value ? Number(form.cholesterol.value) : null,
          weight: form.weight.value ? Number(form.weight.value) : null,
          height: form.height.value ? Number(form.height.value) : null,
          customNotes: form.customNotes.value.trim()
        };

        setMembers(prev => prev.map(m => {
          if (m.id === selectedMemberId) {
            return { ...m, checkups: [newCheckup, ...m.checkups] };
          }
          return m;
        }));

        setShowAddCheckupModal(false);
        showToast('Pemeriksaan fisik baru berhasil disimpan!');
      };

      // Add Illness
      const handleCreateIllness = (e) => {
        e.preventDefault();
        const form = e.target;
        const newIllness = {
          id: 'ill-' + Date.now(),
          name: form.illnessName.value.trim(),
          startDate: form.startDate.value,
          endDate: form.endDate.value || '',
          notes: form.notes.value.trim()
        };

        setMembers(prev => prev.map(m => {
          if (m.id === selectedMemberId) {
            return { ...m, illnesses: [newIllness, ...m.illnesses] };
          }
          return m;
        }));

        setShowAddIllnessModal(false);
        showToast('Riwayat diagnosis/sakit tersimpan');
      };

      // Document Upload Handling
      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 4 * 1024 * 1024) {
          alert('Ukuran file maksimal 4MB');
          return;
        }
        const reader = new FileReader();
        reader.onloadend = () => {
          setUploadPreviewUrl(reader.result);
        };
        reader.readAsDataURL(file);
      };

      const handleCreateDocument = (e) => {
        e.preventDefault();
        if (!uploadPreviewUrl) {
          alert('Silakan ambil atau pilih foto berkas');
          return;
        }
        const form = e.target;
        const newDoc = {
          id: 'doc-' + Date.now(),
          title: form.docTitle.value.trim(),
          category: form.category.value,
          date: form.docDate.value,
          issuer: form.issuer.value.trim() || 'Klinik / Dokter Mandiri',
          notes: form.docNotes.value.trim(),
          fileData: uploadPreviewUrl
        };

        setMembers(prev => prev.map(m => {
          if (m.id === selectedMemberId) {
            return { ...m, documents: [newDoc, ...(m.documents || [])] };
          }
          return m;
        }));

        setShowAddDocumentModal(false);
        setUploadPreviewUrl(null);
        showToast('Foto berkas medis berhasil diunggah!');
      };

      const handleDeleteDocument = (docId) => {
        if (!confirm('Hapus berkas ini?')) return;
        setMembers(prev => prev.map(m => {
          if (m.id === selectedMemberId) {
            return { ...m, documents: (m.documents || []).filter(d => d.id !== docId) };
          }
          return m;
        }));
        if (showDocumentPreview?.id === docId) setShowDocumentPreview(null);
        showToast('Berkas berhasil dihapus');
      };

      // Hapus Anggota Keluarga
      const handleDeleteMember = (memberId, memberName) => {
        if (!confirm(`Hapus anggota keluarga "${memberName}" beserta seluruh riwayat cek dan berkasnya?`)) return;
        setMembers(prev => prev.filter(m => m.id !== memberId));
        if (selectedMemberId === memberId) {
          setSelectedMemberId(null);
        }
        showToast(`Profil ${memberName} berhasil dihapus`);
      };

      // Hapus / Kosongkan Seluruh Data (Reset Data Dummy)
      const handleClearAllData = () => {
        if (!confirm('Apakah Anda yakin ingin menghapus SEMUA data anggota keluarga (termasuk rekam medis dan berkas dummy)?\n\nAplikasi akan dikosongkan agar Anda dapat mulai mengisi data keluarga asli Anda.')) return;
        setMembers([]);
        setSelectedMemberId(null);
        showToast('Semua data berhasil dibersihkan! Silakan tambahkan anggota keluarga Anda.');
      };

      // Muat Ulang Data Contoh (Dummy)
      const handleResetDemoData = () => {
        if (!confirm('Muat ulang 3 data profil contoh (dummy) MedFam?')) return;
        setMembers(INITIAL_MEMBERS);
        setSelectedMemberId(null);
        showToast('Data contoh (dummy) berhasil dimuat kembali');
      };

      // Hapus Pemeriksaan Fisik
      const handleDeleteCheckup = (checkupId) => {
        if (!confirm('Hapus rekam pemeriksaan ini?')) return;
        setMembers(prev => prev.map(m => {
          if (m.id === selectedMemberId) {
            return { ...m, checkups: m.checkups.filter(c => c.id !== checkupId) };
          }
          return m;
        }));
        showToast('Rekam pemeriksaan berhasil dihapus');
      };

      // Hapus Riwayat Sakit
      const handleDeleteIllness = (illnessId) => {
        if (!confirm('Hapus catatan riwayat sakit ini?')) return;
        setMembers(prev => prev.map(m => {
          if (m.id === selectedMemberId) {
            return { ...m, illnesses: m.illnesses.filter(i => i.id !== illnessId) };
          }
          return m;
        }));
        showToast('Catatan riwayat sakit berhasil dihapus');
      };

      // Export CSV
      const handleExportCSV = () => {
        if (!selectedMember) return;
        let csv = `data:text/csv;charset=utf-8,MEDFAM - LAPORAN KESEHATAN KELUARGA\n`;
        csv += `Nama: ${selectedMember.name}, Usia: ${calculateAge(selectedMember.dob)} Thn, Gol: ${selectedMember.bloodType}\n\n`;
        csv += `Tanggal,Gula Darah (mg/dL),Tensi Sistolik,Tensi Diastolik,Kolesterol,Berat (kg),Catatan\n`;
        selectedMember.checkups.forEach(c => {
          csv += `"${c.date}","${c.bloodSugar || '-'}","${c.bpSystolic || '-'}","${c.bpDiastolic || '-'}","${c.cholesterol || '-'}","${c.weight || '-'}","${(c.customNotes || '').replace(/"/g, '""')}"\n`;
        });
        const uri = encodeURI(csv);
        const link = document.createElement("a");
        link.href = uri;
        link.download = `MedFam_${selectedMember.name.replace(/\s+/g, '_')}.csv`;
        link.click();
        showToast('Data CSV berhasil diunduh');
      };

      // Backup JSON
      const handleDownloadBackup = () => {
        const exportData = {
          application: 'MedFam',
          version: '2.0.0',
          exportedAt: new Date().toISOString(),
          data: members
        };
        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `MedFam_Cadangan_Data_${new Date().toISOString().split('T')[0]}.json`;
        link.click();
        URL.revokeObjectURL(url);
        showToast('File backup MedFam (.json) berhasil diunduh');
      };

      // Restore JSON
      const handleRestoreBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            const list = parsed.data || parsed;
            if (Array.isArray(list) && list.length > 0) {
              if (confirm(`Pulihkan ${list.length} profil keluarga dari file cadangan ini?`)) {
                setMembers(list);
                setShowBackupModal(false);
                showToast('Data MedFam berhasil dipulihkan!');
              }
            } else {
              alert('Format file cadangan tidak valid');
            }
          } catch (err) {
            alert('Gagal membaca file cadangan');
          }
        };
        reader.readAsText(file);
      };

      // Analytics Insights
      const latestCheck = selectedMember?.checkups?.[0];
      const insights = useMemo(() => {
        if (!latestCheck) return [];
        const res = [];
        const sugar = evaluateBloodSugar(latestCheck.bloodSugar);
        const bp = evaluateBloodPressure(latestCheck.bpSystolic, latestCheck.bpDiastolic);
        const chol = evaluateCholesterol(latestCheck.cholesterol);

        if (sugar && sugar.level === 'high') {
          res.push({ title: 'Gula Darah Tinggi', desc: `GDS ${latestCheck.bloodSugar} mg/dL (target normal ≤140). Kurangi gula murni & periksa HbA1c.` });
        } else if (sugar && sugar.level === 'warning') {
          res.push({ title: 'Indikasi Pre-Diabetes', desc: 'Nilai gula darah di batas atas. Perbanyak gerak fisik dan batasi karbohidrat tinggi olahan.' });
        }
        if (bp && bp.level === 'high') {
          res.push({ title: 'Tekanan Darah Tinggi', desc: `Tensi ${latestCheck.bpSystolic}/${latestCheck.bpDiastolic} mmHg melebihi standar aman. Batasi asupan garam.` });
        }
        if (chol && chol.level === 'high') {
          res.push({ title: 'Kolesterol Total Meningkat', desc: `Nilai ${latestCheck.cholesterol} mg/dL. Tingkatkan konsumsi sayur, oat, dan kurangi gorengan.` });
        }
        if (res.length === 0) {
          res.push({ title: 'Semua Parameter Normal', desc: 'Indikator pemeriksaan terakhir dalam rentang aman standar Kemenkes RI.' });
        }
        return res;
      }, [latestCheck]);

      return (
        <div className="w-full max-w-[420px] min-h-[844px] bg-slate-50 text-slate-800 rounded-none sm:rounded-[40px] shadow-2xl overflow-hidden border-0 sm:border-[8px] sm:border-slate-800 flex flex-col relative transition-all">
          
          {/* Top Notch Accent */}
          <div className="hidden sm:flex justify-center pt-2 pb-1 bg-slate-800 select-none">
            <div className="w-20 h-4 bg-slate-900 rounded-full flex items-center justify-end px-2 space-x-1">
              <div className="w-2 h-2 rounded-full bg-slate-800"></div>
              <div className="w-1.5 h-1.5 rounded-full bg-teal-500/40"></div>
            </div>
          </div>

          {/* PIN SECURITY LOCK OVERLAY */}
          {(isLocked || isPinSetup) && (
            <div className="absolute inset-0 bg-slate-950/95 backdrop-blur-xl z-50 flex flex-col items-center justify-center p-6 text-white animate-in fade-in duration-200 select-none">
              <div className="w-16 h-16 rounded-3xl bg-teal-500/20 text-teal-400 flex items-center justify-center mb-3 shadow-lg shadow-teal-500/20 border border-teal-500/30">
                <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
              </div>

              <h2 className="text-lg font-bold tracking-tight text-white">
                {isPinSetup ? (isChangingPin ? 'Ubah PIN MedFam' : 'Buat PIN Akses MedFam') : 'Keamanan MedFam'}
              </h2>
              <p className="text-xs text-slate-400 mt-1 text-center max-w-[240px]">
                {isPinSetup
                  ? (pinStep === 1 ? 'Langkah 1: Tentukan 4 digit PIN baru' : 'Langkah 2: Masukkan kembali PIN untuk konfirmasi')
                  : 'Masukkan 4 digit PIN keluarga untuk membuka catatan kesehatan'}
              </p>

              <div className="bg-teal-900/40 border border-teal-500/40 rounded-2xl px-4 py-2 mt-3 text-center w-full max-w-[260px]">
                <span className="text-[10px] font-bold text-teal-300 uppercase tracking-wider block">Mode Demo Portofolio</span>
                <p className="text-xs text-slate-200 mt-0.5">PIN Demo: <span className="font-mono font-bold text-teal-300 bg-teal-950 px-2 py-0.5 rounded border border-teal-500/30">1234</span></p>
                <button
                  type="button"
                  onClick={() => {
                    setIsLocked(false);
                    setIsPinSetup(false);
                    setPinBuffer('');
                    showToast('Selamat datang di Demo MedFam!');
                  }}
                  className="mt-1.5 text-[11px] font-semibold text-teal-400 hover:text-white underline block mx-auto"
                >
                  ⚡ Langsung Buka Demo (1234)
                </button>
              </div>

              {/* Dots */}
              <div className="flex items-center gap-3.5 my-6">
                {[0, 1, 2, 3].map(idx => (
                  <div
                    key={idx}
                    className={`w-4 h-4 rounded-full border-2 transition-all duration-200 ${
                      idx < pinBuffer.length
                        ? 'bg-teal-400 border-teal-400 scale-125 shadow-lg shadow-teal-400/50'
                        : 'border-slate-600 bg-transparent'
                    }`}
                  />
                ))}
              </div>

              {pinError && (
                <p className="text-xs text-rose-400 font-semibold mb-3 px-3 py-1 rounded-full bg-rose-500/20 border border-rose-500/30 animate-pulse">
                  {pinError}
                </p>
              )}

              {/* Numeric Keypad */}
              <div className="grid grid-cols-3 gap-3 w-full max-w-[260px]">
                {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                  <button
                    key={num}
                    type="button"
                    onClick={() => handlePinPress(num)}
                    className="h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700 active:scale-95 active:bg-teal-600 text-xl font-bold text-white transition-all shadow-md flex items-center justify-center border border-slate-700/50"
                  >
                    {num}
                  </button>
                ))}
                <button
                  type="button"
                  onClick={() => {
                    setPinBuffer('');
                    setPinError('');
                  }}
                  className="h-14 rounded-2xl bg-slate-900/60 hover:bg-slate-800 text-xs font-bold text-slate-400 active:scale-95 transition-all flex items-center justify-center border border-slate-800"
                >
                  CLEAR
                </button>
                <button
                  type="button"
                  onClick={() => handlePinPress(0)}
                  className="h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700 active:scale-95 active:bg-teal-600 text-xl font-bold text-white transition-all shadow-md flex items-center justify-center border border-slate-700/50"
                >
                  0
                </button>
                <button
                  type="button"
                  onClick={() => {
                    if (pinBuffer.length > 0) setPinBuffer(pinBuffer.slice(0, -1));
                  }}
                  className="h-14 rounded-2xl bg-slate-900/60 hover:bg-slate-800 text-lg font-bold text-slate-400 active:scale-95 transition-all flex items-center justify-center border border-slate-800"
                >
                  ⌫
                </button>
              </div>

              <div className="mt-4 flex flex-col items-center gap-2">
                <button
                  type="button"
                  onClick={() => {
                    if (confirm('Atur ulang PIN keamanan MedFam?')) {
                      localStorage.removeItem('family_pin_hash');
                      localStorage.removeItem('pin_failed_attempts');
                      localStorage.removeItem('pin_lockout_until');
                      setPinHash(null);
                      setIsPinSetup(true);
                      setPinStep(1);
                      setPinBuffer('');
                      setPinError('');
                      setTempNewPin('');
                    }
                  }}
                  className="text-[11px] text-teal-400/80 hover:text-teal-300 underline transition-colors cursor-pointer"
                >
                  Lupa / Atur Ulang PIN
                </button>
                <div className="text-[10px] text-slate-500 flex items-center gap-1.5">
                  <span>🔒</span> Terenkripsi SHA-256 standar industri
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMessage && (
            <div className="absolute top-14 left-4 right-4 z-50 bg-slate-900/95 text-white px-3.5 py-2.5 rounded-2xl shadow-xl flex items-center gap-2 text-xs font-semibold backdrop-blur animate-in fade-in duration-200">
              <svg className="w-4 h-4 text-teal-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
              </svg>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* APP HEADER */}
          <header className="bg-white/95 backdrop-blur-md px-4 pt-3.5 pb-3 border-b border-slate-200 sticky top-0 z-20 flex items-center justify-between">
            {selectedMemberId ? (
              <div className="flex items-center space-x-2.5 overflow-hidden">
                <button
                  onClick={() => setSelectedMemberId(null)}
                  className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 flex items-center justify-center shrink-0"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7" />
                  </svg>
                </button>
                <div className="truncate">
                  <h1 className="text-sm font-bold text-slate-900 leading-tight flex items-center gap-1.5 truncate">
                    <span className="truncate">{selectedMember?.name}</span>
                    <span className="text-[10px] font-medium px-1.5 py-0.2 rounded-md bg-teal-50 text-teal-700 border border-teal-200 shrink-0">
                      {selectedMember?.relation}
                    </span>
                  </h1>
                  <p className="text-[11px] text-slate-500 font-medium truncate">
                    {calculateAge(selectedMember?.dob)} Thn • {selectedMember?.gender} • Gol. {selectedMember?.bloodType}
                  </p>
                </div>
              </div>
            ) : (
              <div>
                <div className="flex items-center space-x-2">
                  <div className="w-7 h-7 rounded-xl bg-teal-600 text-white flex items-center justify-center shadow-md shadow-teal-500/30">
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.4" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                    </svg>
                  </div>
                  <span className="text-lg font-black tracking-tight text-slate-900">
                    Med<span className="text-teal-600">Fam</span>
                  </span>
                  <span className="text-[9px] font-bold uppercase tracking-wider bg-amber-50 text-amber-700 px-1.5 py-0.5 rounded border border-amber-200">
                    DEMO
                  </span>
                </div>
                <p className="text-[10.5px] text-slate-500 font-medium">Pemantauan Kesehatan Keluarga & Berkas</p>
              </div>
            )}

            {/* Header Right Actions */}
            <div className="flex items-center space-x-1 shrink-0">
              {selectedMemberId ? (
                <div className="flex items-center space-x-1">
                  <button
                    onClick={() => setShowExportReportModal(true)}
                    className="px-2.5 py-1.5 rounded-xl bg-teal-50 hover:bg-teal-100 text-teal-800 text-xs font-semibold flex items-center gap-1 border border-teal-200"

                  {selectedMember.checkups[0] && (
                    <div className="space-y-1 text-[11px]">
                      <span className="font-bold text-slate-800">Pemeriksaan Terakhir:</span>
                      <div className="flex justify-between py-1 border-b border-slate-200">
                        <span>Gula Darah (GDS)</span>
                        <span className="font-bold">{selectedMember.checkups[0].bloodSugar || '-'} mg/dL</span>
                      </div>
                      <div className="flex justify-between py-1 border-b border-slate-200">
                        <span>Tekanan Darah</span>
                        <span className="font-bold">{selectedMember.checkups[0].bpSystolic ? `${selectedMember.checkups[0].bpSystolic}/${selectedMember.checkups[0].bpDiastolic}` : '-'}</span>
                      </div>
                      <div className="flex justify-between py-1 border-b border-slate-200">
                        <span>Kolesterol Total</span>
                        <span className="font-bold">{selectedMember.checkups[0].cholesterol || '-'} mg/dL</span>
                      </div>
                    </div>
                  )}

                  <div className="space-y-1 text-[11px]">
                    <span className="font-bold text-slate-800">Berkas Medis Terlampir ({selectedMember.documents?.length || 0}):</span>
                    <div className="flex flex-wrap gap-1">
                      {(selectedMember.documents || []).map((d, i) => (
                        <span key={i} className="text-[9px] bg-slate-200 px-2 py-0.5 rounded-full">{d.title}</span>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="mt-4 space-y-2">
                  <button
                    onClick={() => window.print()}
                    className="w-full py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold shadow-md shadow-teal-600/30 flex items-center justify-center gap-1.5"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                    </svg>
                    Cetak / Simpan ke PDF Sekarang
                  </button>
                  <button
                    onClick={handleExportCSV}
                    className="w-full py-2 rounded-xl border border-slate-200 text-slate-700 text-xs font-semibold"
                  >
                    Unduh Format CSV
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 4. Modal Backup, Cloud & Keamanan */}
          {showBackupModal && (
            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3">
              <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-4 max-h-[92vh] overflow-y-auto no-scrollbar">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 className="text-sm font-bold text-slate-900 flex items-center gap-1.5">
                    <svg className="w-4 h-4 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2 1 3 3 3h10c2 0 3-1 3-3V7M4 7c0-2 1-3 3-3h10c2 0 3 1 3 3M4 7h16m-7 4v6m-3-3h6" />
                    </svg>
                    Cadangan & Cloud Database
                  </h3>
                  <button onClick={() => setShowBackupModal(false)} className="w-7 h-7 rounded-full bg-slate-100 text-slate-500">
                    ✕
                  </button>
                </div>

                {/* Sandbox Demo Card */}
                <div className="p-3.5 bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200 rounded-2xl space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-amber-900 flex items-center gap-1.5">
                      <span>🛡️</span> Mode Demo (Sandbox)
                    </span>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300">
                      Sandbox Portofolio
                    </span>
                  </div>
                  <p className="text-[11px] text-amber-800 leading-relaxed">
                    Versi ini adalah <strong>Demo Portofolio</strong>. Semua data berjalan secara mandiri di memori browser Anda (Local Sandbox) dan 100% terisolasi dari database utama pengguna.
                  </p>
                </div>

                {/* Cloud Supabase Card */}
                <div className="p-3 bg-gradient-to-br from-teal-50 to-emerald-50 border border-teal-200 rounded-2xl space-y-2.5">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-teal-900 flex items-center gap-1.5">
                      <span>⚡</span> Uji Database Sendiri (Opsional)
                    </span>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${isSupabaseConnected ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}`}>
                      {isSupabaseConnected ? '🟢 Terhubung' : '⚪ Sandbox'}
                    </span>
                  </div>
                  <p className="text-[11px] text-teal-700">Pengunjung juga dapat menguji koneksi Supabase milik sendiri jika diinginkan.</p>
                  
                  <div className="space-y-1.5">
                    <input
                      type="url"
                      id="supaUrlInput"
                      defaultValue={supabaseUrl}
                      placeholder="Supabase Project URL"
                      className="w-full px-2.5 py-1.5 text-xs rounded-xl border border-teal-200 bg-white"
                    />
                    <input
                      type="text"
                      id="supaKeyInput"
                      defaultValue={supabaseKey}
                      placeholder="Supabase Anon Key"
                      className="w-full px-2.5 py-1.5 text-xs rounded-xl border border-teal-200 bg-white"
                    />
                  </div>

                  <div className="flex gap-1.5 pt-1">
                    <button
                      type="button"
                      disabled={isSyncingCloud}
                      onClick={() => {
                        const url = document.getElementById('supaUrlInput').value.trim();
                        const key = document.getElementById('supaKeyInput').value.trim();
                        handleSaveSupabase(url, key);
                      }}
                      className="flex-1 py-1.5 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-semibold"
                    >
                      {isSyncingCloud ? 'Menghubungkan...' : 'Simpan & Hubungkan'}
                    </button>
                    {isSupabaseConnected && (
                      <div className="flex gap-1">
                        <button
                          type="button"
                          disabled={isSyncingCloud}
                          onClick={handleSyncToCloud}
                          className="py-1.5 px-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold"
                          title="Unggah data saat ini ke cloud"
                        >
                          ☁️ Upload
                        </button>
                        <button
                          type="button"
                          disabled={isSyncingCloud}
                          onClick={handlePullFromCloud}
                          className="py-1.5 px-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-semibold"
                          title="Tarik data terbaru dari cloud"
                        >
                          📥 Tarik Data
                        </button>
                      </div>
                    )}
                  </div>
                </div>

                {/* PIN Security Card */}
                <div className="p-3 bg-slate-50 border border-slate-200 rounded-2xl space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                      <span>🔐</span> Keamanan PIN MedFam
                    </span>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-teal-50 text-teal-700 border border-teal-200">
                      {pinHash ? 'PIN Aktif' : 'Belum Ada PIN'}
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-500">Lindungi riwayat medis keluarga Anda dari orang luar.</p>
                  <div className="flex gap-1.5 pt-1">
                    <button
                      type="button"
                      onClick={() => {
                        setIsChangingPin(true);
                        setIsPinSetup(true);
                        setPinStep(1);
                        setPinBuffer('');
                        setPinError('');
                        setShowBackupModal(false);
                      }}
                      className="flex-1 py-1.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold"
                    >
                      🔑 {pinHash ? 'Ubah PIN' : 'Buat PIN'}
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setIsLocked(true);
                        setPinBuffer('');
                        setShowBackupModal(false);
                      }}
                      className="py-1.5 px-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-semibold"
                    >
                      🔒 Kunci
                    </button>
                  </div>
                </div>

                <div className="space-y-3 pt-1">
                  {/* Data Management / Reset Dummy */}
                  <div className="p-3 bg-rose-50/60 border border-rose-200 rounded-2xl space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-rose-900 flex items-center gap-1.5">
                        <span>🗑️</span> Kelola & Kosongkan Data
                      </span>
                    </div>
                    <p className="text-[11px] text-rose-700">
                      Hapus data contoh (dummy) agar aplikasi siap diisi dengan data asli keluarga Anda.
                    </p>
                    <div className="flex gap-2 pt-1">
                      <button
                        type="button"
                        onClick={() => {
                          setShowBackupModal(false);
                          handleClearAllData();
                        }}
                        className="flex-1 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-semibold shadow-sm"
                      >
                        Hapus Semua Data
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          setShowBackupModal(false);
                          handleResetDemoData();
                        }}
                        className="py-1.5 px-2.5 bg-white border border-rose-200 hover:bg-rose-50 text-rose-700 rounded-xl text-xs font-semibold"
                        title="Muat ulang 3 data profil contoh"
                      >
                        Muat Ulang Dummy
                      </button>
                    </div>
                  </div>

                  <div className="p-3 bg-teal-50/70 border border-teal-100 rounded-2xl space-y-2">
                    <p className="text-xs font-bold text-teal-900">1. Unduh Cadangan File JSON</p>
                    <p className="text-[11px] text-teal-700">Simpan seluruh profil, rekam cek, dan foto berkas dalam file JSON aman.</p>
                    <button
                      onClick={handleDownloadBackup}
                      className="w-full py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-semibold"
                    >
                      Unduh File Backup (.json)
                    </button>
                  </div>

                  <div className="p-3 bg-slate-50 border border-slate-200 rounded-2xl space-y-2">
                    <p className="text-xs font-bold text-slate-800">2. Pulihkan Data dari File Cadangan</p>
                    <p className="text-[11px] text-slate-500">Pilih file JSON backup yang pernah diunduh sebelumnya.</p>
                    <button
                      onClick={() => backupFileInputRef.current?.click()}
                      className="w-full py-2 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold"
                    >
                      Pilih File Backup JSON
                    </button>
                    <input
                      ref={backupFileInputRef}
                      type="file"
                      accept=".json,application/json"
                      className="hidden"
                      onChange={handleRestoreBackup}
                    />
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 5. Modal Tambah Anggota */}
          {showAddMemberModal && (
            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h3 className="text-sm font-bold text-slate-900">Tambah Anggota Keluarga</h3>
                  <button onClick={() => setShowAddMemberModal(false)} className="w-7 h-7 rounded-full bg-slate-100 text-slate-500">✕</button>
                </div>
                <form onSubmit={handleCreateMember} className="mt-3 space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
                    <input name="name" required placeholder="Contoh: Siti Aisyah" className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Tanggal Lahir</label>
                      <input name="dob" type="date" required className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Hubungan</label>
                      <select name="relation" className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300 bg-white">
                        <option value="Ayah">Ayah</option>
                        <option value="Ibu">Ibu</option>
                        <option value="Anak">Anak</option>
                        <option value="Kakek">Kakek</option>
                        <option value="Nenek">Nenek</option>
                        <option value="Lainnya">Lainnya</option>
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Jenis Kelamin</label>
                      <select name="gender" className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300 bg-white">
                        <option value="Pria">Pria</option>
                        <option value="Wanita">Wanita</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Golongan Darah</label>
                      <select name="bloodType" className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300 bg-white">
                        <option value="A+">A+</option>
                        <option value="B+">B+</option>
                        <option value="AB+">AB+</option>
                        <option value="O+">O+</option>
                        <option value="Belum dicek">Belum dicek</option>
                      </select>
                    </div>
                  </div>
                  <button type="submit" className="w-full py-2.5 mt-2 rounded-xl bg-teal-600 text-white text-xs font-semibold shadow-md shadow-teal-600/30">
                    Simpan Profil MedFam
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 6. Modal Tambah Cek Rutin */}
          {showAddCheckupModal && (
            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl max-h-[92vh] overflow-y-auto no-scrollbar">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h3 className="text-sm font-bold text-slate-900">Catat Hasil Pemeriksaan</h3>
                  <button onClick={() => setShowAddCheckupModal(false)} className="w-7 h-7 rounded-full bg-slate-100 text-slate-500">✕</button>
                </div>
                <form onSubmit={handleCreateCheckup} className="mt-3 space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Tanggal Cek</label>
                    <input name="checkupDate" type="date" defaultValue={new Date().toISOString().split('T')[0]} required className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Gula Darah (mg/dL)</label>
                      <input name="bloodSugar" type="number" placeholder="110" className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Kolesterol (mg/dL)</label>
                      <input name="cholesterol" type="number" placeholder="190" className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Tensi Sistolik</label>
                      <input name="bpSystolic" type="number" placeholder="120" className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Tensi Diastolik</label>
                      <input name="bpDiastolic" type="number" placeholder="80" className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Berat Badan (kg)</label>
                      <input name="weight" type="number" step="0.1" placeholder="65" className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Tinggi Badan (cm)</label>
                      <input name="height" type="number" placeholder="165" className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Catatan Tambahan</label>
                    <textarea name="customNotes" rows="2" placeholder="Setelah sarapan / keluhan tertentu..." className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300"></textarea>
                  </div>
                  <button type="submit" className="w-full py-2.5 rounded-xl bg-teal-600 text-white text-xs font-semibold shadow-md shadow-teal-600/30">
                    Simpan Hasil Cek
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 7. Modal Catat Sakit */}
          {showAddIllnessModal && (
            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h3 className="text-sm font-bold text-slate-900">Catat Riwayat Sakit</h3>
                  <button onClick={() => setShowAddIllnessModal(false)} className="w-7 h-7 rounded-full bg-slate-100 text-slate-500">✕</button>
                </div>
                <form onSubmit={handleCreateIllness} className="mt-3 space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Nama Penyakit / Diagnosis</label>
                    <input name="illnessName" required placeholder="Contoh: Asam Lambung / Flu Berat" className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Tanggal Mulai</label>
                      <input name="startDate" type="date" required className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Tanggal Sembuh</label>
                      <input name="endDate" type="date" className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Keterangan / Terapi Obat</label>
                    <textarea name="notes" rows="2" placeholder="Obat yang diberikan atau anjuran dokter..." className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300"></textarea>
                  </div>
                  <button type="submit" className="w-full py-2.5 rounded-xl bg-teal-600 text-white text-xs font-semibold shadow-md shadow-teal-600/30">
                    Simpan Riwayat
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 8. Modal Pedoman MedFam */}
          {showDisclaimerInfo && (
            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <h3 className="text-sm font-bold text-slate-900">Pedoman Klinis MedFam</h3>
                  <button onClick={() => setShowDisclaimerInfo(false)} className="w-7 h-7 rounded-full bg-slate-100 text-slate-500">✕</button>
                </div>
                <div className="text-xs text-slate-600 space-y-2">
                  <p><strong>Gula Darah Sewaktu (GDS):</strong> Mengacu pada konsensus PERKENI 2021 (Normal: 90-140 mg/dL, Pre-Diabetes: 141-199 mg/dL).</p>
                  <p><strong>Tekanan Darah:</strong> Mengacu pada standar JNC 8 & Kemenkes RI (Normal: ≤120/80 mmHg).</p>
                  <p><strong>Kolesterol Total:</strong> Target rujukan optimal adalah &lt;200 mg/dL.</p>
                  <div className="p-2.5 bg-teal-50 text-teal-800 rounded-xl">
                    Semua data disimpan di memori peramban Anda dan dapat di-backup kapan saja.
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
